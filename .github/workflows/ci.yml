name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Icarus Verilog and Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate correctness harness (known-good/known-broken pairs)
        run: python3 scripts/validate_testbenches.py

      - name: Run unit tests
        run: pytest -q

  mock-pipeline-smoke-test:
    runs-on: ubuntu-latest
    needs: harness-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Icarus Verilog and Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start mock serving layer
        run: |
          python3 serving/mock_vllm_server.py --port 8000 --profile fp16 &
          python3 serving/mock_vllm_server.py --port 8001 --profile int8 &
          sleep 2

      - name: Run pilot request matrix against mock servers
        run: |
          python3 harness/request_runner.py \
            --manifest prompts/prompt_manifest.yaml \
            --configs serving/configs.example.json \
            --trials 2 \
            --output-dir results/raw

      - name: Run paired comparison + correctness eval
        run: |
          LATEST=$(ls -t results/raw/*.json | head -1)
          python3 eval/paired_comparison.py \
            --raw-results "$LATEST" \
            --manifest prompts/prompt_manifest.yaml \
            --output results/processed/summary.json \
            --compare fp16 int8

      - name: Generate report
        run: |
          python3 scripts/generate_report.py \
            --summary results/processed/summary.json \
            --hardware "CI mock run" --model "mock" \
            --n-prompts 2 --n-trials 2
